name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Expo login
        run: eas login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get commit short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger EAS Build (Android APK)
        id: build
        run: |
          BUILD_ID=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --no-wait \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for build to complete
        run: |
          echo "⏳ Waiting for EAS build ${{ steps.build.outputs.build_id }}..."
          eas build:view ${{ steps.build.outputs.build_id }} --json > /dev/null 2>&1

          while true; do
            STATUS=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status')
            echo "  Status: $STATUS"

            if [ "$STATUS" = "FINISHED" ]; then
              echo "✅ Build completed!"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi

            echo "  Waiting 60s..."
            sleep 60
          done

      - name: Get build artifact URL
        id: artifact
        run: |
          BUILD_JSON=$(eas build:view ${{ steps.build.outputs.build_id }} --json)
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.artifacts.buildUrl')
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: |
          curl -L -o arka-plan-${{ steps.sha.outputs.short }}.apk \
            "${{ steps.artifact.outputs.apk_url }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "Build ${{ steps.sha.outputs.short }}"
          body: |
            🤖 Automated build from commit `${{ steps.sha.outputs.short }}`

            **What's new:**
            - See commit history for changes

            📥 Download the APK below and install on your Android device.
          files: arka-plan-${{ steps.sha.outputs.short }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS (IPA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Expo login
        run: eas login --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get commit short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger EAS Build (iOS)
        id: build
        run: |
          BUILD_ID=$(eas build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --json \
            --no-wait \
            | jq -r '.[0].id')
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for build to complete
        run: |
          echo "⏳ Waiting for EAS build ${{ steps.build.outputs.build_id }}..."
          eas build:view ${{ steps.build.outputs.build_id }} --json > /dev/null 2>&1

          while true; do
            STATUS=$(eas build:view ${{ steps.build.outputs.build_id }} --json | jq -r '.status')
            echo "  Status: $STATUS"

            if [ "$STATUS" = "FINISHED" ]; then
              echo "✅ Build completed!"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi

            echo "  Waiting 60s..."
            sleep 60
          done

      - name: Get build artifact URL
        id: artifact
        run: |
          BUILD_JSON=$(eas build:view ${{ steps.build.outputs.build_id }} --json)
          IPA_URL=$(echo "$BUILD_JSON" | jq -r '.artifacts.buildUrl')
          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"

      - name: Download IPA
        run: |
          curl -L -o arka-plan-${{ steps.sha.outputs.short }}.ipa \
            "${{ steps.artifact.outputs.ipa_url }}"

      - name: Append iOS to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "Build ${{ steps.sha.outputs.short }}"
          files: arka-plan-${{ steps.sha.outputs.short }}.ipa
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
