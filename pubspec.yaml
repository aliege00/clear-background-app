name: arka_plan
description: "Arka Plan — Offline Background Remover. Free, unlimited, no account needed."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Image processing & ML
  image: ^4.3.0
  onnxruntime: ^1.16.3
  path_provider: ^2.1.5

  # Device features
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  path: ^1.9.0

  # Ads (Android/iOS only — Windows stub)
  google_mobile_ads: ^5.3.0

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
